<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Helvetica', sans-serif;
      overflow: hidden;
    }
    #open-btn {
      padding: 15px 35px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
      transition: transform 0.2s;
      z-index: 10;
    }
    #open-btn:hover {
      transform: scale(1.05);
    }
    #text-container {
      display: none;
      text-align: center;
      z-index: 2;
    }
    #message {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ff2a55;
      text-shadow: 0 0 10px #ff2a55;
    }
    .emoji {
      position: absolute;
      bottom: -50px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <button id="open-btn" onclick="openExperience()">Open Me ❤️</button>
  <div id="text-container">
    <h1 id="message"></h1>
  </div>

  <script>
    const fullText = "I Love you bugdi too much 💖";
    const emojis = ['❤️', '💖', '💕', '🌹', '✨', '😍', '💌'];

    function openExperience() {
      document.getElementById('open-btn').style.display = 'none';
      document.getElementById('text-container').style.display = 'block';

      // Typewriter Animation
      let index = 0;
      const msgElement = document.getElementById('message');
      const timer = setInterval(() => {
        msgElement.innerHTML += fullText[index];
        index++;
        if (index === fullText.length) clearInterval(timer);
      }, 100);

      // Floating Emojis Animation
      setInterval(createEmoji, 300);
    }

    function createEmoji() {
      const emoji = document.createElement('div');
      emoji.classList.add('emoji');
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.fontSize = (Math.random() * 20 + 20) + 'px';
      document.body.appendChild(emoji);

      setTimeout(() => { emoji.remove(); }, 4000);
    }
  </script>
</body>
</html>
